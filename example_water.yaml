# ESPHome device setup: required for this ESP8266 example.
esphome:
  name: estia-ab             # Required device/network name.
  friendly_name: Estia AB   # Optional display name for the device.

esp8266:
  board: esp12e               # Required; select the board you actually use.

# Optional logging. Disable serial logging to keep UART0 free for the AB bus.
logger:
  baud_rate: 0                # Required to be set to 0 in order to use the UART for the Toshiba system
  level: DEBUG                # Optional; DEBUG is the logger's default.

api:                         # Optional; enables the Home Assistant native API.
ota:                         # Optional; enables firmware updates over the network.
  platform: esphome

# Network configuration for this example. Define these values in secrets.yaml.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10dB        # Recommended, lowers the noise created by the power spikes, defaults to 20dB

# Required to load this external component.
external_components:
  - source:
      type: git
      url: https://github.com/makusets/esphome-toshiba-ab
      ref: new_code

# Required AB-bus UART settings. Choose pins to match your hardware.
uart:
  rx_pin: GPIO13             # Required receive connection.
  tx_pin: GPIO12             # Optional in the current receive-only implementation.
  baud_rate: 2400            # Required; must be 2400.
  parity: EVEN               # Initial setting; the component selects EVEN for TCC/A0
                             # and NONE for TU2C at runtime.
  rx_buffer_size: 2048       # Optional; ESPHome defaults to 256 bytes.

climate:
  - platform: toshiba_ab       # Required.
    system_type: water        # Required for Estia; default is air.

    # Optional settings; uncomment to override defaults.
    # format: auto             # Default: auto (recommended). Use tu2c for older R410A Estia Systems,
                               # or a0 for Newer R32 Estia systems.
    # master_address: auto     # Default: auto; or require an address, e.g. 0x00.
    # esp_address: auto        # Default: auto; or keep a protocol-appropriate address.
    # name: Estia DHW          # Optional main name; used for DHW unless dhw.name is set.

    # Optional thermostat selection:
    # dhw: true                # Default: true; default name: Estia DHW.
    # zone_1: true             # Default: true; default name: Estia Zone 1.
    # zone_2: false            # Default: false; name when enabled: Estia Zone 2.
                               # Set any circuit to false to omit its thermostat.

    # Optional names and display ranges:
    # Youc can use a mapping instead of true/false above for that circuit. Uncomment ONLY one
    # definition per circuit. A mapping enables the circuit.
    # The visual values below are the component defaults, not required settings.
    # visual changes the Home Assistant display, not the system's operating limits.
    # Rebuild and upload after changing YAML; the standard HA card cannot edit
    # these ranges. In Zone 1 Auto mode there is no fixed target temperature.
    # Zone 1 and Zone 2 have no presets; DHW retains its presets.
    #
    # dhw:
    #   name: Estia DHW        # Optional; omit to keep the default name.
    #   visual:               # Optional; omit the whole block to use defaults.
    #     min_temperature: 40
    #     max_temperature: 65
    #     temperature_step: 0.5
    #
    # zone_1:
    #   name: Estia Zone 1     # Optional; omit to keep the default name.
    #   visual:
    #     min_temperature: 20     # Temperature limits make sense if the zone operates
    #     max_temperature: 65     # floor heating, often limited to 40-45 degrees
    #     temperature_step: 0.5
    #
    # zone_2:
    #   name: Estia Zone 2     # Optional; this mapping enables Zone 2.
    #   visual:
    #     min_temperature: 20     # Temperature limits make sense if the zone operates
    #     max_temperature: 65     # floor heating, often limited to 40-45 degrees
    #     temperature_step: 0.5

    # Optional diagnostic entity names; defaults shown below.
    # diagnostic:
    #   name: Toshiba AB Diagnostic
    # reset_button:
    #   name: Toshiba AB Reset

