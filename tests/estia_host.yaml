esphome:
  name: estia-tests
  build_path: ../../work/estia-host
host:
logger:
  baud_rate: 0
external_components:
  - source:
      type: local
      path: ../components
uart:
  port: /dev/null
  baud_rate: 2400
  parity: EVEN
climate:
  - platform: toshiba_ab
    name: Estia DHW
    id: toshiba_estia
    frame_format: a0
    zone2_climate: true
    night_setback:
      name: Night Setback
    waterpump_active:
      name: Water Pump Active
    heating_cooling_compressor_active:
      name: Heating Cooling Compressor Active
    dhw_compressor_active:
      name: DHW Compressor Active
    dhw_resistor_active:
      name: DHW Resistor Active
    heating_resistor_active:
      name: Heating Resistor Active
    heating_external_booster_active:
      name: Heating External Booster Active
    frost_protection:
      name: Frost Protection
    # Silent Mode is available only in first-generation ESTIA configurations.
    dhw_boost:
      name: DHW Boost
    antibacteria:
      name: Antibacteria
    test_mode_active:
      name: Test Mode Active
number:
  - platform: template
    name: Estia Demand
    min_value: 0
    max_value: 15
    step: 1
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            if (std::isfinite(x) && x >= 0 && x <= 15)
              id(toshiba_estia).send_estia_demand(static_cast<uint8_t>(x));
