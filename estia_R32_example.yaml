###############################################################################
# Example ESPHome config for Toshiba Estia heat pump via AB-bus (A0-protocol)
#
# Protocol: Estia A0-protocol at 2400 baud 8E1 (NOT TCC-Link or TU2C)
# Compatible with Toshiba Estia R32 systems. For ESTIA R410A systems, use
# estia_R410A_example.yaml instead.
###############################################################################

esphome:
  name: toshiba-estia

esp8266:
  board: esp12e

logger:
  baud_rate: 0    # Required to free hardware UART for AB-protocol
  level: DEBUG    # Optional, defaults to DEBUG, set to VERBOSE if diagnosing problems

api:

ota:
  - platform: esphome
    password: "your_ota_password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Toshiba Estia Fallback"
    password: "your_ap_password"

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/makusets/esphome-toshiba-ab
    refresh: 0s

# AB-Bus UART
uart:
  tx_pin: GPIO15    # Adjust for your board variant if different
  rx_pin: GPIO13
  baud_rate: 2400
  parity: EVEN
  rx_buffer_size: 2048

climate:
  - platform: toshiba_ab
    
    # DHW thermostat: Heat enables hot-water production and Off disables it.
    # Its target/current temperatures are the DHW setpoint and tank temperature.
    # The Boost preset in the thermostat controls the Hot Water Boost setting;
    # select None/Normal preset in the thermostat to turn boost off.
    
    name: "Toshiba Estia DHW"
    id: toshiba_estia


    # Zone 1 thermostat defaults to enabled; set zone1_climate: false to omit it.
    # Auto uses Toshiba's heating curve, so it intentionally has no target temperature.
    # Off disables heating/cooling operation only; it leaves DHW enabled.
    # Optionally the name and id can be overriden

    zone1_climate:      # Optionally override thermostat naming and id
      name: "Toshiba Estia Zone 1"
      id: estia_zone1

    # Zone 2 defaults to disabled; use true or a block to enable it.
    # Operating mode is shared with Zone 1.
    # zone2_climate:
    #   name: "Toshiba Estia Zone 2"

    # A0-protocol (used by R32 Estia/heat pump models, NOT TCC-Link or TU2C)

    frame_format: a0  #required

    # Optional one-byte addresses, the defaults below may be omitted.
    # remote: 0x40
    # master: 0x00

    # Autonomous polling: query E8:C0 (temperatures) and E8:C1 (operating hours) regularly
    # This is the default setting and can be omitted, uncomment and change to false if you need it for some reason
    # autonomous: true

    # Optional Diagnostic sensors
    connected:
      name: "Estia Connected"  #sensor that monitors the connection to the master is alive
    failed_crcs:
      name: "Estia Failed CRCs"  #sensor that counts failed frames
      
    #read-only enables putting the esp in read-only mode for experimentation or diagnosing, with no comms being sent
    # read_only: true           # Optional: listen without sending commands or polls
    read_only_switch:
      name: "Read only"         # optional switch to turn on and off read only mode while the esp is running

    # Optional R32 feature switches: omit any entry to avoid creating that switch.
    # Anti Bacteria enables the DHW antibacterial function. Configure its
    # schedule and temperature on the Toshiba wired remote.
    antibacteria:
      name: "Estia Anti Bacteria"
    # Frost Protection is intended for an otherwise idle installation; the
    # heat pump uses low-temperature heating (15 C) and displays F on the remote.
    frost_protection:
      name: "Estia Frost Protection"
    # Night Setback enables Toshiba's night temperature reduction. Configure
    # its schedule and reduction on the wired remote.
    # Zone thermostats report the "Night setback" preset only while the
    # reduction is applied. The preset is feedback, not a schedule control.
    # DHW keeps its independent Boost preset.
    night_setback:
      name: "Estia Night Setback"

    # Optional standalone setpoints (also shown by the thermostats).
    dhw_setpoint:
      name: "Estia DHW Setpoint"
    zone1_setpoint:
      name: "Estia Zone 1 Setpoint"
    zone2_setpoint:
      name: "Estia Zone 2 Setpoint"

    # Temperatures from E8:C0. TWI, TTW and TFI also update from STATUS.
    # autonomous: false stops polling; received bus data still updates sensors.
    
    compressor_discharge_temperature:  # TD
      name: "Estia Compressor Discharge Temperature"
    outdoor_temperature:  # TO
      name: "Estia Outdoor Temperature"
    condenser_temperature:  # TC
      name: "Estia Condenser Temperature"
    water_inlet_temperature:  # TWI
      name: "Estia Water Inlet Temperature"
    water_outlet_temperature:  # TWO; also used by the Zone 1 climate entity
      name: "Estia Water Outlet Temperature"
    water_heater_outlet_temperature:  # THO
      name: "Estia Water Heater Outlet Temperature"
    zone2_water_temperature:  # TFI; optional Zone 2 circuit, floor inlet temperature
      name: "Estia Zone 2 Water Temperature"
    dhw_current_temperature:  # TTW; also used by the DHW climate entity
      name: "Estia DHW Temperature"

    suction_temperature:  # TS
      name: "Estia Suction Temperature"
    outdoor_coil_temperature:  # TE
      name: "Estia Outdoor Coil Temperature"
    outdoor_pipe_temperature:  # TL
      name: "Estia Outdoor Pipe Temperature"
    low_pressure:
      name: "Estia Low Pressure"
    water_flow:
      name: "Estia Water Flow"

    # E8:C1 operating values and counters (already in hours; no scale needed).
    compressor_frequency:
      name: "Estia Compressor Frequency"
    fan_speed:
      name: "Estia Fan Speed"
    mixing_valve_position:
      name: "Estia Mixing Valve Position"
    waterpump_duty:
      name: "Estia Water Pump Duty"
    dhw_compressor_hours:
      name: "Estia DHW Compressor Hours"
    
    compressor_hours:
      name: "Estia Heating Compressor Hours"
    waterpump_hours:
      name: "Estia Water Pump Hours"
    backup_heater_hours:
      name: "Estia Backup Heater Hours"

    # Optional individual queries for values absent from the E8 responses.
    # EF:2C hour counters (0xF0-0xF7) use 100-hour units and change slowly.
    # sensors:
    #   - address: 0xF2
    #     scale: 100
    #     sensor:
    #       name: "Estia Cooling Compressor Hours"
    #       unit_of_measurement: "h"
    #       accuracy_decimals: 0
    #       device_class: duration
    #       state_class: total_increasing
    # Other query scales: 0x7A pressure x0.01 MPa; 0x74 valve x10 pulses.
    # Current 0x6A uses x0.1 A but may be inaccurate at low load.

    # 0-10V demand sensor (shows current demand value 0..15)
    # demand:
    #   name: "Estia 0-10V Demand"

# Optional: 0-10V demand emulation
# Uncomment the sections below to emulate the physical 0-10V interface
# in software. This sends periodic heartbeats as address 0x0041.
# Also set demand_enabled: true in the climate section above.

