esphome:
  name: toshiba-ab
  friendly_name: Toshiba AB

esp8266:
  board: esp12e

logger:
  baud_rate: 0
  level: DEBUG

api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/makusets/esphome-toshiba-ab
      ref: new_code

uart:
  id: ab_bus
  tx_pin: GPIO12
  rx_pin: GPIO13
  baud_rate: 2400
  parity: EVEN
  rx_buffer_size: 2048

climate:
  - platform: toshiba_ab
    name: Toshiba Thermostat
    master_address: auto
    esp_address: auto
    format: auto
    system_type: Air
