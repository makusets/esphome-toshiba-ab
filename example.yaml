#######################################################################################################################################
#This is an example of the ESPHome yaml file needed to work with Home Assistant. Make sure you use your own network credentials.
########################################################################################################################################
esphome:
  name: toshiba-ac
  friendly_name: toshiba_AC

esp8266:
  board: esp12e




# Enable logging
logger:
  baud_rate: 0  #disable hardware UART log, necessary to use the pins for UART communication with the AC unit 
  level: DEBUG

# Enable Home Assistant API
api:


ota:
  password: "your_ota_password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10dB      #lowers transmission power, reduces noise on AB line a lot, increase if needed, the default (when omitted) is 20dB
                          #10dB typically gets good wifi coverage unless in a weak signal area, can be any number of dB between 8.5dB to 20.5dB

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ap_timeout: 180s
    ssid: "Toshiba-Ac"
    password: "your_ap_password"

captive_portal:

#I2C bus for optional temperature sensor
i2c:
  sda: GPIO4  # GPIO2 for v3 and v1 boards
  scl: GPIO14
  scan: True

external_components:
  - source:
      type: git
      url: https://github.com/makusets/esphome-toshiba-ab
    refresh: 0s  #optional, how often to download fresh files from source, defaults to 1 day, use 0 to force updates 


# Serial bus for the Toshiba AB protocol
uart:
  tx_pin: GPIO12 # GPIO10 for v3 or GPIO15 for v1 board
  rx_pin: GPIO13
  baud_rate: 2400
  parity: EVEN 
  rx_buffer_size: 2048    # optionally increase buffer to avoid dropped bytes

climate:

  - platform: toshiba_ab
    name: "Toshiba AC"
    id: toshiba_ac
    connected:
      name: "Toshiba AC Connected"  # optional, binary sensor that monitors link with AC
      
    # --- Optional addresses and protocol selection ---
    # --- This is example is suited for most air systems, for estia systems, refer to the estia yaml examples
    
    
    master: 0x00                # optional, will autodetect if omitted (recommended)
    remote: 0x40                # optional, will autoassign if omitted (recommended)
    frame_format: tcc-link      # defaults to auto if ommitted. Needs to be set for hm, tu2c, estia and estia_a0
                                # if using any of these protocols (check docs/frame_formats.md)

    # more options can be found in the complete_example yaml and the estia specific yaml examples


sensor:                        # needed for the bme temp sensor to work if installed
  - platform: bme280_i2c
    temperature:
      name: "Indoor Temperature"
      id: bme_temp
      oversampling: 1x
    pressure:
      name: "Indoor Pressure"
      id: bme_pressure
      accuracy_decimals: 0
      oversampling: 1x
    humidity:
      name: "Indoor Humidity"
      id: bme_humidity
      accuracy_decimals: 0
      oversampling: 2x
    address: 0x76
    update_interval: 30s

    



