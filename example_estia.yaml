###############################################################################
# Example ESPHome config for Toshiba Estia heat pump via AB-bus (A0-protocol)
#
# Protocol: Estia A0-protocol at 2400 baud 8E1 (NOT TCC-Link or TU2C)
# Compatible with Toshiba Estia R32 systems. For ESTIA R410A systems, use
# estia_R410A.yaml instead.
###############################################################################

esphome:
  name: toshiba-estia

esp8266:
  board: esp12e

logger:
  baud_rate: 0    # Free hardware UART for AB-protocol
  level: INFO

api:

ota:
  password: "your_ota_password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Toshiba Estia Fallback"
    password: "your_ap_password"

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/makusets/esphome-toshiba-ab
    refresh: 0s

# AB-Bus UART
uart:
  tx_pin: GPIO15    # Adjust for your board variant
  rx_pin: GPIO13
  baud_rate: 2400
  parity: EVEN
  rx_buffer_size: 2048

climate:
  - platform: toshiba_ab
  
    # DHW thermostat: Heat enables hot-water production and Off disables it.
    # Its target/current temperatures are the DHW setpoint and tank temperature.
    name: "Toshiba Estia DHW"
    id: toshiba_estia

    # When a0 frame_format is selected, a second thermostat named "Toshiba Estia Zone 1 Water" is created
    # automatically for Zone 1 heat/cool/auto/off and water-outlet temperature.
    # Auto uses Toshiba's heating curve, so it intentionally has no target temperature.
    # Off disables heating/cooling operation only; it leaves DHW enabled.

    # A0-protocol (used by R32 Estia/heat pump models, NOT TCC-Link or TU2C)
    frame_format: a0
    filter_frames: false

    # Optional one-byte addresses, the defaults below may be omitted.
    # remote: 0x40
    # master: 0x00

    # Autonomous polling: query E8:C0 (temperatures) and E8:C1 (operating hours)
    # This is the default setting and can be omitted, uncomment and change to false if you need it for some reason
    # autonomous: true

    # Diagnostic sensors
    connected:
      name: "Estia Connected"
    failed_crcs:
      name: "Estia Failed CRCs"
      #read-only switch enable putting the esp in read-only mode for experimentation or diagnosing, with no comms being sent
    read_only_switch:
      name: "Estia Read Only"

    # Setpoints reported by the periodic 03:C6 status frame.
    dhw_setpoint:
      name: "Estia DHW Setpoint"
    zone1_setpoint:
      name: "Estia Zone 1 Setpoint"
    zone2_setpoint:
      name: "Estia Zone 2 Setpoint"

    # Confirmed R32 temperatures reported by the periodic E8:C0 response.
    # Declaring these sensors does not add separate service-code queries.
    # This will not fill if autonomous is set to false
    
    compressor_discharge_temperature:  # TD
      name: "Estia Compressor Discharge Temperature"
    outdoor_temperature:  # TO
      name: "Estia Outdoor Temperature"
    condenser_temperature:  # TC
      name: "Estia Condenser Temperature"
    water_inlet_temperature:  # TWI
      name: "Estia Water Inlet Temperature"
    water_outlet_temperature:  # TWO; also used by the Zone 1 climate entity
      name: "Estia Water Outlet Temperature"
    water_heater_outlet_temperature:  # THO
      name: "Estia Water Heater Outlet Temperature"
    zone2_water_temperature:  # TFI; optional Zone 2 circuit
      name: "Estia Zone 2 Water Temperature"
    dhw_current_temperature:  # TTW; also used by the DHW climate entity
      name: "Estia DHW Temperature"

    # Estia-specific runtime sensors
    # This will not fill if autonomous is set to false
    compressor_hours:
      name: "Estia Compressor Hours"
    waterpump_hours:
      name: "Estia Water Pump Hours"
    backup_heater_hours:
      name: "Estia Backup Heater Hours"

    # 0-10V demand sensor (shows current demand value 0..15)
    # demand:
    #   name: "Estia 0-10V Demand"

# Optional: 0-10V demand emulation
# Uncomment the sections below to emulate the physical 0-10V interface
# in software. This sends periodic heartbeats as address 0x0041.
# Also set demand_enabled: true in the climate section above.

# number:
#   - platform: template
#     name: "Estia Demand"
#     id: estia_demand
#     min_value: 0
#     max_value: 15
#     step: 1
#     optimistic: true
#     restore_value: true
#     set_action:
#       - lambda: id(toshiba_estia).send_estia_demand((uint8_t)x);

# Optional: switches for runtime control
switch:
  - platform: template
    name: "Estia Autonomous"
    id: estia_autonomous
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(toshiba_estia).set_autonomous(true);
    turn_off_action:
      - lambda: id(toshiba_estia).set_autonomous(false);
  # - platform: template
  #   name: "Estia Demand Enable"
  #   id: estia_demand_enable
  #   optimistic: true
  #   restore_mode: RESTORE_DEFAULT_OFF
  #   turn_on_action:
  #     - lambda: id(toshiba_estia).set_demand_enabled(true);
  #   turn_off_action:
  #     - lambda: id(toshiba_estia).set_demand_enabled(false);
